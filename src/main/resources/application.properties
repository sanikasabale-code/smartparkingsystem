# ===================================================================
# File: application.properties
# Description: Externalized configuration for the Spring Boot application.
# Syllabus Topics Demonstrated:
#   - Module III.5: application.properties and Externalized Configuration
#   - Module III.5: Logging level configuration
#   - Module IV.3: MySQL & Spring Data JPA database properties
# ===================================================================

# Application details and port
spring.application.name=SmartParkingSystem
server.port=8080

# ===================================================================
# DATABASE CONFIGURATION:
# OPTION 1: In-Memory H2 Database (Active by default - ZERO SETUP required!)
# Allows instant run in VS Code without needing MySQL server running.
# ===================================================================
spring.datasource.url=jdbc:h2:mem:parkingdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===================================================================
# OPTION 2: MySQL Database Connection (For College Lab Viva with MySQL)
# To use MySQL: comment Option 1 above and uncomment lines below.
# ===================================================================
# spring.datasource.url=jdbc:mysql://localhost:3306/smart_parking_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# spring.datasource.username=root
# spring.datasource.password=root
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Spring Data JPA and Hibernate settings
# Concept: Hibernate automatically creates and updates database tables
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Load initial seed data from data.sql after tables are created
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Concept: Custom application property read in AppConfig using @Value
parking.default.rate=20.0

# Concept: Logging level configuration
logging.level.root=INFO
logging.level.com.smartparking=INFO
